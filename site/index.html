<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>01 Whispering Currents · Generative Hours</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>" />
  <style>
    /* Phase 1 — 작품 하나를 전체화면으로 보기 위한 최소 스타일.
       Phase 3 에서 site/css/style.css 로 옮겨간다. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #050507; }
    #stage {
      display: block; width: 100%; height: 100%;
      background: #050507;      /* 첫 프레임 전에도 검정 — 흰 번쩍임 방지 */
      touch-action: none;       /* 없으면 드래그가 그림 대신 페이지를 스크롤한다 */
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script type="module" src="./js/currents.js"></script>
</body>
</html>
